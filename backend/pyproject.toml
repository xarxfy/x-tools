[project]
name = "x-tools"
version = "0.1.0"
description = "Self-hosted overview of your servers, services, Docker containers and the sites you host."
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.32.1",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "pydantic-settings==2.6.1",
    "cryptography==44.0.0",
    "argon2-cffi==23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[project.scripts]
x-tools = "app.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["migrations/*.py", "migrations/versions/*.py", "alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
