# Used only for creating new migrations during development:
#   XT_DATA_DIR=./dev-data alembic revision --autogenerate -m "describe change"
# At runtime X-TOOLS applies migrations itself on startup.
[alembic]
script_location = app/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
